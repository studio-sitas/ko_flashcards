<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2419"/>
      <stop offset="1" stop-color="#171410"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDCE87"/>
      <stop offset="1" stop-color="#D49E3C"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed, square, fully opaque, no rounded corners: iOS applies its own
       mask/rounding to home-screen icons, and pads icons that already have
       transparent or rounded corners onto a white tile instead of using them
       edge-to-edge. This variant is for apple-touch-icon only. -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <g transform="rotate(-7 256 268)">
    <rect x="126" y="106" width="260" height="324" rx="34" fill="url(#cardGrad)"/>
    <text x="256" y="272" text-anchor="middle" dominant-baseline="central"
          font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="240" fill="#221E17">K</text>
  </g>

  <circle cx="398" cy="118" r="32" fill="#E2B458"/>
  <circle cx="398" cy="118" r="32" fill="none" stroke="#171410" stroke-width="6"/>
</svg>
