<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2419"/>
      <stop offset="1" stop-color="#171410"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDCE87"/>
      <stop offset="1" stop-color="#D49E3C"/>
    </linearGradient>
  </defs>

  <!-- Maskable icon: Android/Chrome crop this to whatever tile shape the user
       picked (circle, squircle, rounded square, teardrop...), so the background
       must fill the full square edge-to-edge and all meaningful content must sit
       inside the centered "safe zone" (~40% radius) or it gets clipped. -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <g transform="rotate(-6 256 256)">
    <rect x="161" y="138" width="190" height="236" rx="26" fill="url(#cardGrad)"/>
    <text x="256" y="262" text-anchor="middle" dominant-baseline="central"
          font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="172" fill="#221E17">K</text>
  </g>
</svg>
